<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smoke Test • Trilha Inteligente</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #05101F;
      color: #E2E8F0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 2px solid #0E2A4D;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.25rem;
      color: #00B4D8;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge {
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-running {
      background: #FFC93C;
      color: #05101F;
    }
    .status-pass {
      background: #3CCB7F;
      color: #05101F;
    }
    .status-fail {
      background: #E8484F;
      color: #FFFFFF;
    }
    .detalhes {
      font-size: 0.88rem;
      color: #94A3B8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-acao {
      background: #0E2A4D;
      color: #00B4D8;
      border: 1px solid #00B4D8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .btn-acao:hover {
      background: #00B4D8;
      color: #05101F;
    }
    .iframe-container {
      flex: 1;
      border: 2px solid #0E2A4D;
      border-radius: 8px;
      overflow: hidden;
      background: #071426;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .passos-lista {
      font-size: 0.82rem;
      display: flex;
      gap: 12px;
      color: #CBD5E1;
      padding: 4px 0;
    }
    .passo-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🧪 Smoke Test Automatizado • Trilha Inteligente</h1>
      <div style="font-size: 0.8rem; color: #64748B; margin-top: 2px;">
        Verifica se a aplicação monta a tela inicial e disponibiliza o botão #btn-jogar-convidado.
      </div>
    </div>
    <div id="badge-container">
      <span class="status-badge status-running" id="badge-status">⏳ EXECUTANDO...</span>
    </div>
  </header>

  <div class="detalhes">
    <div id="mensagem-status">Carregando index.html no iframe...</div>
    <div class="passos-lista">
      <span class="passo-item" id="chk-header">⚪ Cabeçalho</span>
      <span class="passo-item" id="chk-container">⚪ Tela Container</span>
      <span class="passo-item" id="chk-btn">⚪ #btn-jogar-convidado</span>
    </div>
    <button class="btn-acao" onclick="executarSmokeTest()">🔄 Rodar Novamente</button>
  </div>

  <div class="iframe-container">
    <iframe id="iframe-alvo" src="index.html"></iframe>
  </div>

  <script>
    window.__SMOKE_PASSED__ = false;
    window.__SMOKE_LOGS__ = [];

    function registrar(msg) {
      console.log('[SMOKE TEST]', msg);
      window.__SMOKE_LOGS__.push(msg);
    }

    function atualizarStatus(passou, mensagem) {
      const badge = document.getElementById('badge-status');
      const msgEl = document.getElementById('mensagem-status');
      if (passou) {
        badge.className = 'status-badge status-pass';
        badge.textContent = '✅ PASSOU (TELA MONTADA)';
        msgEl.innerHTML = `<strong style="color: #3CCB7F;">SUCESSO:</strong> ${mensagem}`;
        window.__SMOKE_PASSED__ = true;
      } else {
        badge.className = 'status-badge status-fail';
        badge.textContent = '❌ FALHOU';
        msgEl.innerHTML = `<strong style="color: #E8484F;">FALHA:</strong> ${mensagem}`;
        window.__SMOKE_PASSED__ = false;
      }
    }

    function executarSmokeTest() {
      const badge = document.getElementById('badge-status');
      const msgEl = document.getElementById('mensagem-status');
      const chkHeader = document.getElementById('chk-header');
      const chkContainer = document.getElementById('chk-container');
      const chkBtn = document.getElementById('chk-btn');
      
      badge.className = 'status-badge status-running';
      badge.textContent = '⏳ EXECUTANDO...';
      msgEl.textContent = 'Iniciando verificação do iframe...';
      chkHeader.textContent = '⚪ Cabeçalho';
      chkContainer.textContent = '⚪ Tela Container';
      chkBtn.textContent = '⚪ #btn-jogar-convidado';
      window.__SMOKE_PASSED__ = false;

      const iframe = document.getElementById('iframe-alvo');
      iframe.src = 'index.html?t=' + Date.now();

      const tempoInicio = Date.now();
      const TIMEOUT_MS = 8000;

      const timer = setInterval(() => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (!doc) return;

          // 1. Verifica cabeçalho
          const h1 = doc.querySelector('.app-header h1');
          if (h1 && h1.textContent.includes('Trilha Inteligente')) {
            chkHeader.innerHTML = '🟢 <span style="color:#3CCB7F;">Cabeçalho</span>';
          }

          // 2. Verifica container
          const container = doc.getElementById('tela-container');
          if (container && container.innerHTML.trim().length > 100) {
            chkContainer.innerHTML = '🟢 <span style="color:#3CCB7F;">Tela Container</span>';
          }

          // 3. Verifica botão #btn-jogar-convidado
          const btnConvidado = doc.getElementById('btn-jogar-convidado');
          if (btnConvidado) {
            chkBtn.innerHTML = '🟢 <span style="color:#3CCB7F;">#btn-jogar-convidado</span>';
            clearInterval(timer);
            const tempoDecorrido = ((Date.now() - tempoInicio) / 1000).toFixed(2);
            atualizarStatus(true, `Botão #btn-jogar-convidado encontrado em ${tempoDecorrido}s com texto: "${btnConvidado.textContent.trim()}".`);
            registrar('Smoke test concluído com êxito.');
            return;
          }

          // Checa se apareceu box de erro na tela
          const erroBox = doc.getElementById('box-erro-global-trilha');
          if (erroBox) {
            clearInterval(timer);
            atualizarStatus(false, 'Detectada caixa de erro global no iframe: ' + erroBox.textContent.slice(0, 150));
            return;
          }

          if (Date.now() - tempoInicio > TIMEOUT_MS) {
            clearInterval(timer);
            atualizarStatus(false, 'Tempo limite de 8s esgotado sem encontrar #btn-jogar-convidado.');
          }
        } catch (e) {
          // Erro de acesso cross-origin ou exceção
          registrar('Erro durante polling do iframe: ' + e.message);
        }
      }, 250);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(executarSmokeTest, 300);
    });
  </script>
</body>
</html>
