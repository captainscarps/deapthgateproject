<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testes • Roleta da Governança</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #071426; color: #E2E8F0; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { color: #FFC93C; }
    .placar { font-size: 1.2rem; font-weight: 800; padding: 12px; border-radius: 10px; background: #0B2545; margin: 12px 0; }
    .pass { color: #3CCB7F; } .fail { color: #FF4D6D; }
    li { margin: 6px 0; } small { color: #94A3B8; }
  </style>
</head>
<body>
  <h1>Testes automáticos • Roleta da Governança</h1>
  <p>Valida o banco de perguntas (data/perguntas.json), as fontes (data/fontes.json) e o desenho de todas as opções de personagem.</p>
  <div class="placar" id="placar">Rodando...</div>
  <ul id="lista"></ul>
  <script type="module">
    import { carregarBanco, CATEGORIAS } from './js/perguntas.js';
    import { AVATAR_OPCOES, AVATAR_PADRAO, renderAvatarSVG, validarAvatar, gerarAvatarAleatorio } from './js/avatar.js';
    import { mascote } from './js/mascotes.js';
    import { apostaMinima, validarAposta, liquidar, tokensDaPartida, pontuarResposta } from './js/duelos.js';

    const lista = document.getElementById('lista');
    let ok = 0, falhas = 0;
    function registrar(nome, passou, detalhe = '') {
      passou ? ok++ : falhas++;
      const li = document.createElement('li');
      li.className = passou ? 'pass' : 'fail';
      li.innerHTML = `${passou ? '✅' : '❌'} ${nome} <small>${detalhe}</small>`;
      lista.appendChild(li);
    }

    const dados = await (await fetch('data/perguntas.json')).json();
    const perguntas = dados.perguntas || [];
    const idsCat = CATEGORIAS.map(c => c.id);

    // 1. IDs únicos
    const ids = perguntas.map(p => p.id);
    const repetidos = ids.filter((id, i) => ids.indexOf(id) !== i);
    registrar('IDs de perguntas únicos', repetidos.length === 0, repetidos.join(', ') || `${ids.length} perguntas`);

    // 2. Categoria válida
    const catInvalida = perguntas.filter(p => !idsCat.includes(p.categoria));
    registrar('Todas as perguntas têm categoria válida', catInvalida.length === 0, catInvalida.map(p => p.id).join(', '));

    // 3. Alternativas e gabarito
    const estrutura = perguntas.filter(p => !Array.isArray(p.alternativas) || p.alternativas.length < 2 || p.alternativas.length > 4
      || p.alternativas.some(a => !String(a).trim()) || !(p.correta >= 0 && p.correta < p.alternativas.length));
    registrar('Alternativas (2 a 4) e gabarito dentro do intervalo', estrutura.length === 0, estrutura.map(p => p.id).join(', '));

    // 4. Alternativas sem duplicata
    const dup = perguntas.filter(p => new Set(p.alternativas.map(a => a.trim().toLowerCase())).size !== p.alternativas.length);
    registrar('Nenhuma pergunta com alternativas repetidas', dup.length === 0, dup.map(p => p.id).join(', '));

    // 5. Explicação presente
    const semExp = perguntas.filter(p => !String(p.explicacao || '').trim());
    registrar('Toda pergunta tem explicação', semExp.length === 0, semExp.map(p => p.id).join(', '));

    // 5b. Status e fontes
    const STATUS = ['aprovada', 'exemplo', 'revisao', 'rascunho'];
    const statusRuim = perguntas.filter(p => p.status && !STATUS.includes(p.status));
    registrar('Status das perguntas válidos', statusRuim.length === 0, statusRuim.map(p => p.id).join(', '));
    const fontesJson = await (await fetch('data/fontes.json')).json();
    const idsFontes = new Set((fontesJson.fontes || []).map(f => f.id));
    registrar('IDs de fontes únicos', idsFontes.size === (fontesJson.fontes || []).length, `${idsFontes.size} fontes`);
    const semFonte = perguntas.filter(p => p.fonte_id && !idsFontes.has(p.fonte_id));
    registrar('Toda fonte citada nas perguntas existe em fontes.json', semFonte.length === 0, semFonte.map(p => `${p.id}→${p.fonte_id}`).join(', '));
    const textoVazado = (fontesJson.fontes || []).filter(f => 'texto' in f);
    registrar('fontes.json não contém o texto integral dos documentos', textoVazado.length === 0, textoVazado.map(f => f.id).join(', '));
    const pendentes = perguntas.filter(p => p.status === 'revisao' || p.status === 'rascunho');
    registrar('Nenhuma pergunta em revisão/rascunho publicada por engano (aviso)', true, pendentes.length ? `${pendentes.length} ficarão fora do jogo` : 'ok');

    // 6. Mínimo por categoria (para uma partida não repetir demais)
    const banco = await carregarBanco();
    CATEGORIAS.forEach(c => {
      const n = banco.porCategoria[c.id].length;
      registrar(`Categoria ${c.nomeLongo}: pelo menos 8 perguntas`, n >= 8, `${n} perguntas`);
    });

    // 7. Perguntas difíceis disponíveis para disputa de selo
    CATEGORIAS.forEach(c => {
      const n = banco.porCategoria[c.id].filter(p => (p.nivel || 1) >= 2).length;
      registrar(`Categoria ${c.nomeLongo}: tem pergunta nível 2+ para o selo`, n >= 1, `${n} perguntas`);
    });

    // 8. Personagem: todas as opções desenham sem erro nos 3 modos e 4 reações
    let erros = [];
    const props = ['corpo', 'expressao', 'roupa', 'cabelo', 'barba', 'rosto', 'cabeca', 'item', 'mobilidade'];
    for (const prop of props) {
      for (const valor of AVATAR_OPCOES[prop]) {
        for (const modo of ['completo', 'busto', 'peao']) {
          try {
            const svg = renderAvatarSVG({ ...AVATAR_PADRAO, [prop]: valor }, { modo });
            if (!svg.startsWith('<svg') || svg.includes('undefined') || svg.includes('NaN')) erros.push(`${prop}=${valor}/${modo}`);
          } catch (e) { erros.push(`${prop}=${valor}/${modo}: ${e.message}`); }
        }
      }
    }
    for (const reacao of ['neutro', 'pulando', 'comemorando', 'assustado']) {
      const svg = renderAvatarSVG(AVATAR_PADRAO, { reacao });
      if (svg.includes('undefined') || svg.includes('NaN')) erros.push(`reacao=${reacao}`);
    }
    registrar('Personagem: todas as opções desenham sem erro', erros.length === 0, erros.slice(0, 5).join(' | ') || 'ok');

    // 9. Avatares aleatórios sempre válidos
    const invalidos = Array.from({ length: 200 }, () => gerarAvatarAleatorio()).filter(a => !validarAvatar(a).valido);
    registrar('200 avatares aleatórios são válidos', invalidos.length === 0, `${invalidos.length} inválidos`);

    // 10. Mascotes
    const mascErr = [...idsCat, 'coroa'].filter(id => ['feliz', 'triste', 'surpreso', 'piscando'].some(h => {
      const s = mascote(id, { humor: h }); return !s.includes('<svg') || s.includes('undefined');
    }));
    registrar('Mascotes de todas as categorias e humores', mascErr.length === 0, mascErr.join(', ') || 'ok');

    // 11. Duelos com aposta
    registrar('Aposta mínima = 20% do saldo (arredonda para cima)', apostaMinima(100) === 20 && apostaMinima(37) === 8 && apostaMinima(1) === 1 && apostaMinima(0) === 1,
      `100→${apostaMinima(100)}, 37→${apostaMinima(37)}, 1→${apostaMinima(1)}`);
    const casos = [
      [{ saldoDesafiante: 100, saldoDesafiado: 50, aposta: 20 }, true, 'aposta mínima válida'],
      [{ saldoDesafiante: 100, saldoDesafiado: 50, aposta: 19 }, false, 'abaixo de 20%'],
      [{ saldoDesafiante: 100, saldoDesafiado: 15, aposta: 20 }, false, 'adversário sem saldo para a mínima'],
      [{ saldoDesafiante: 100, saldoDesafiado: 50, aposta: 60 }, false, 'acima do saldo do adversário'],
      [{ saldoDesafiante: 100, saldoDesafiado: 500, aposta: 120 }, false, 'acima do próprio saldo'],
      [{ saldoDesafiante: 100, saldoDesafiado: 500, aposta: 100 }, true, 'apostar tudo'],
      [{ saldoDesafiante: 0, saldoDesafiado: 50, aposta: 1 }, false, 'sem tokens']
    ];
    const falhosAposta = casos.filter(([c, esperado]) => validarAposta(c).ok !== esperado).map(x => x[2]);
    registrar('Validação de apostas (7 cenários)', falhosAposta.length === 0, falhosAposta.join(', ') || 'ok');
    const v = liquidar(500, 300, 20), dr = liquidar(300, 500, 20), e = liquidar(400, 400, 20);
    registrar('Vencedor leva o pote; empate devolve', v.recebeEu === 40 && v.recebeAdv === 0 && dr.recebeEu === 0 && dr.recebeAdv === 40 && e.recebeEu === 20 && e.recebeAdv === 20,
      `vitória +${v.saldoLiquidoEu}, derrota ${dr.saldoLiquidoEu}, empate ${e.saldoLiquidoEu}`);
    registrar('Tokens da partida solo (1 a cada 100 pontos, mínimo 1)', tokensDaPartida(2450) === 24 && tokensDaPartida(50) === 1, `2450→${tokensDaPartida(2450)}`);
    registrar('Pontuação do duelo (rapidez e última ×2)', pontuarResposta({ correta: true, tempoMs: 0, indice: 0 }) === 150 && pontuarResposta({ correta: true, tempoMs: 15000, indice: 6 }) === 200 && pontuarResposta({ correta: false, tempoMs: 0, indice: 0 }) === 0, 'ok');

    document.getElementById('placar').innerHTML = falhas === 0
      ? `<span class="pass">✅ ${ok} TESTES PASSARAM</span> · 100% de aprovação`
      : `<span class="pass">✅ ${ok} passaram</span> · <span class="fail">❌ ${falhas} falharam</span>`;
  </script>
</body>
</html>
